{{/* Keep a minimum number of pods running during voluntary disruptions */}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "capstone-api.fullname" . }}
  labels:
    {{- include "capstone-api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "capstone-api.selectorLabels" . | nindent 6 }}
{{- end }}
